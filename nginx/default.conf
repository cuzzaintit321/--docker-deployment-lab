server {
    listen 80;
    server_tokens off;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /health/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location / { return 404; }
}
