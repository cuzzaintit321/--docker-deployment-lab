<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Board · Deployment Lab</title>
<style>:root{font-family:system-ui,sans-serif;color:#e7eefb;background:#0b1020;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:950px;padding:30px;margin:35px auto}.label{color:#80d9ca;font-size:12px;font-weight:700;letter-spacing:2px}h1{font-size:clamp(28px,5vw,42px);margin:12px 0}p{color:#9eadc4}.status{display:inline-block;border:1px solid #3e6b63;background:#153630;color:#9ce1d0;border-radius:20px;padding:7px 12px;font-size:13px}form{margin:30px 0;display:flex;gap:12px}input{flex:1;min-width:0;padding:15px;border:1px solid #35455e;background:#141f32;color:#fff;border-radius:9px;font-size:16px}button{border:0;border-radius:8px;padding:12px 18px;background:#90e3d1;color:#092921;cursor:pointer;font-weight:650}.item{border:1px solid #2d3d56;border-radius:12px;background:#121c2f;padding:20px;margin:12px 0;display:flex;gap:20px;align-items:center;justify-content:space-between}.item p{font-size:12px;margin-bottom:0}.resolved{opacity:.65}.resolved strong{text-decoration:line-through}#error{color:#ffc7ad}footer{margin-top:35px;font-size:12px;color:#9eadc4}label{display:block;margin-top:24px;font-size:14px}@media(max-width:500px){main{padding:18px}.item{align-items:flex-start}form{flex-direction:column}}</style>
<main><div class="label">DOCKER / POSTGRESQL / NGINX</div><h1>Operations Board</h1><p>A small service with a database you can deploy, inspect, and recover.</p><span class="status" id="health">Checking database…</span><label for="title">New operational check</label><form id="form"><input id="title" maxlength="160" required placeholder="e.g. Verify backup restore"><button>Add check</button></form><p id="error" role="alert"></p><div id="list" aria-live="polite">Loading checks…</div><footer>Portfolio deployment lab · Local access · Latest 100 records</footer></main>
<script>
const el=id=>document.getElementById(id);
async function request(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Service unavailable');return d}
async function load(){try{await request('/health/ready');el('health').textContent='Database ready';const data=await request('/api/checks');el('list').replaceChildren();if(!data.items.length)el('list').textContent='No checks yet. Add your first operational check above.';for(const item of data.items){const card=document.createElement('article');card.className='item'+(item.status==='resolved'?' resolved':'');const info=document.createElement('div');const title=document.createElement('strong');title.textContent=item.title;const detail=document.createElement('p');detail.textContent='#'+item.id+' · '+item.status+' · '+item.created_at;info.append(title,detail);card.append(info);if(item.status==='open'){const b=document.createElement('button');b.textContent='Resolve';b.onclick=async()=>{b.disabled=true;try{await request('/api/checks/'+item.id+'/resolve',{});await load()}catch(e){el('error').textContent=e.message;b.disabled=false}};card.append(b)}el('list').append(card)}el('error').textContent=''}catch(e){el('health').textContent='Service unavailable';el('error').textContent=e.message+' — displayed records may be stale.'}}
el('form').onsubmit=async e=>{e.preventDefault();const button=el('form').querySelector('button');button.disabled=true;try{await request('/api/checks',{title:el('title').value});el('title').value='';await load()}catch(e){el('error').textContent=e.message}finally{button.disabled=false}};load();
</script></html>
